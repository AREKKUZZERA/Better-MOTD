# BetterMOTD config
# Text format: AUTO, AUTO_STRICT, MINI_MESSAGE, LEGACY_AMPERSAND, LEGACY_SECTION, HEX_AMPERSAND, JSON
colorFormat: "AUTO"

# Profile used by default. Can be changed at runtime with /bettermotd profile <id>.
activeProfile: "default"

placeholders:
  # Supported: %online%, %max%, %version%, %profile%, %preset%, %motd_frame%, %time%
  enabled: true

placeholderAPI:
  # Requires PlaceholderAPI plugin. Works in MOTD/hover text, without hard dependency.
  enabled: false

maintenance:
  enabled: false
  # Optional profile shown in the server list while maintenance is enabled.
  profile: "maintenance"
  bypassPermission: "bettermotd.maintenance.bypass"
  kickMessage: "<red>Server is in maintenance mode.</red>"

debug:
  selfTest: false
  verbose: false

profiles:
  default:
    # RANDOM = random preset every ping
    # STICKY_PER_IP = random preset, then keep it for the same IP for stickyTtlSeconds
    # HASHED_PER_IP = stable preset based on IP
    # ROTATE = next preset on every ping
    selectionMode: "STICKY_PER_IP"
    stickyTtlSeconds: 10
    stickyMaxEntriesPerProfile: 10000
    stickyCleanupEveryNPings: 500

    animation:
      enabled: true
      frameIntervalMillis: 600
      # GLOBAL = all clients see the same animation frame
      # PER_IP_STICKY = each IP keeps one frame during stickyTtlSeconds
      motdAnimationMode: "GLOBAL"

    playerCount:
      # Paper-only options. On Bukkit/Spigot they are ignored with one warning.
      disableHover: false
      hidePlayerCount: false
      hoverLines:
        - "<green>BetterMOTD</green>"
        - "<gray>Online: <white>%online%</white>/<white>%max%</white></gray>"

      fakePlayers:
        enabled: false
        # static: "5", random: "2:8", percent: "25%"
        mode: "static"
        value: "0"

      # Shows max players as online + x.
      justXMore:
        enabled: false
        x: 3

      # Fixed max players shown in the server list.
      maxPlayers:
        enabled: false
        value: 100

    presets:
      - id: "main"
        weight: 1
        icon: "default.png"
        # Optional random icons independent from MOTD selection.
        icons: []
        # Optional conditions:
        # conditions:
        #   hostnames: ["play.example.net"]
        #   hostnameContains: ["event"]
        #   minProtocol: 767
        #   maxProtocol: 999
        #   minOnline: 0
        #   maxOnline: 100
        motdFrames:
          - "<gradient:#00D431:#00BF4B><bold>BetterMOTD</bold></gradient>\n<gray>Online: <white>%online%</white>/<white>%max%</white> | %version%</gray>"
          - "<#00D431><bold>BetterMOTD</bold></#00D431>\n<gray>Welcome! Time: <white>%time%</white></gray>"

  maintenance:
    selectionMode: "ROTATE"
    animation:
      enabled: false
    playerCount:
      disableHover: false
      hidePlayerCount: false
      hoverLines:
        - "<red>Maintenance</red>"
        - "<gray>Please try again later.</gray>"
    presets:
      - id: "maintenance"
        weight: 1
        icon: "default.png"
        motd:
          - "<red><bold>Maintenance</bold></red>"
          - "<gray>Server is temporarily closed.</gray>"
